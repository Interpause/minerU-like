# Copy to config.local.toml. Relative paths resolve beside the config file.
data_dir = "data"
host = "127.0.0.1"
port = 8000
captioning = true
cross_page_tables = true
render_dpi = 200
max_image_side = 2880
advanced_render_dpi = 300
advanced_max_image_side = 4096

[libreoffice]
mode = "auto" # off, auto, system, flatpak
# Select your Flatpak explicitly with mode = "flatpak".
flatpak_app_id = "org.libreoffice.LibreOffice"
timeout = 120

[compression]
enabled = true
min_savings = 0.10
qualities = [95, 90, 85, 80]
method = 6
# cwebp_binary = "/absolute/path/to/cwebp"
# preset_overrides = {drawing = "drawing", photo = "photo", text = "text"}

[svg]
enabled = true

[runtime]
mode = "managed"
# binary = "data/llama-b12120/llama-server" # Auto-discovered when exactly one is present.
model = "data/models/OvisOCR3.Q8_0.gguf"
mmproj = "data/models/OvisOCR3.mmproj-bf16.gguf"
device = "auto"
kv_cache = "bf16"
# kv_cache_k = "bf16" # Optional independent override of kv_cache.
# kv_cache_v = "q8_0"
context_size = 32768 # Per slot; total allocation is context_size * parallel_slots.
max_tokens = 16384
image_min_tokens = 196 # Ovis patch16/merge2: 196 tokens correspond to 448 x 448 pixels.
# This ceiling can downscale Advanced images depending on area and aspect ratio.
image_max_tokens = 8192
# Omit image_max_tokens or set -1 to use the backend/model default.
parallel_slots = 4 # Concurrent inference slots.
batch_size = 1024 # Logical token batch size, including within a single request.
ubatch_size = 1024 # Physical compute microbatch; smaller values reduce peak compute memory.
# request_timeout = 3600 # Omitted by default: queue and generation have no overall deadline.

# External mode uses the same task adapter without managing the remote process:
# mode = "external"
# base_url = "http://127.0.0.1:8080"
# api_key = "your-private-key"
# model_alias = "ovisocr3"
