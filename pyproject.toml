[project]
name = "mineru-like"
version = "0.1.0"
description = "Local OvisOCR3 document parsing with Zotero-compatible APIs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pillow>=11,<13",
  "pypdfium2>=4.30,<6",
  "docvortex==0.6.13",
]

[project.scripts]
mineru-like = "mineru_like.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "reportlab>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mineru_like"]

[tool.hatch.build.targets.wheel.force-include]
"licenses" = "mineru_like/licenses"
"THIRD_PARTY_NOTICES.md" = "mineru_like/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
